name: autonomous-finops-guardian

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      EXECUTION_MODE: ${EXECUTION_MODE:-simulation}
      ALLOW_AWS_SCAN: ${ALLOW_AWS_SCAN:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MPLBACKEND: Agg
    volumes:
      - ./.env:/app/.env:ro
    expose: ["8000"]
    ports: ["${BACKEND_PORT:-8000}:8000"]
    networks: [finops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: { VITE_API_BASE_URL: /api }
    ports: ["${FRONTEND_PORT:-8080}:8080"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [finops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [blackbox]
    networks: [finops, monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks: [monitoring]
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: [docker-metrics]
    command: ["--docker_only=true", "--store_container_labels=false"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    expose: ["8080"]
    networks: [monitoring]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [linux-host]
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro"]
    expose: ["9100"]
    networks: [monitoring]
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    profiles: [monitoring]
    expose: ["9115"]
    networks: [finops, monitoring]
    restart: unless-stopped

networks:
  finops:
  monitoring:

volumes:
  prometheus-data:
  grafana-data:
