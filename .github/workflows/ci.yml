name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          EXECUTION_MODE: simulation
          ALLOW_AWS_SCAN: "false"
          AWS_EC2_METADATA_DISABLED: "true"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: autonomous-finops-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: autonomous-finops-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  configuration:
    name: Configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML
      - name: Validate YAML and dashboard JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          roots = [Path(".github/workflows"), Path("k8s"), Path("monitoring")]
          yaml_files = [Path("docker-compose.yml"), Path("docker-compose.docker-metrics.yml")]
          for root in roots:
              yaml_files.extend(root.rglob("*.yaml"))
              yaml_files.extend(root.rglob("*.yml"))
          for path in sorted(set(yaml_files)):
              list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
          json.loads(Path("monitoring/grafana/dashboards/finops-containers.json").read_text(encoding="utf-8"))
          print(f"Validated {len(set(yaml_files))} YAML files and the Grafana dashboard JSON")
          PY
      - name: Validate Docker Compose models
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.docker-metrics.yml config --quiet
